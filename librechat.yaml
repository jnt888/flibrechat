version: 1.3.13

fileConfig:
  serverFileSizeLimit: 25
  fileTokenLimit: 100000
  endpoints:
    default:
      fileLimit: 50
      fileSizeLimit: 20
      totalSizeLimit: 200
    DeepSeek:
      fileLimit: 50
      fileSizeLimit: 20
      totalSizeLimit: 200

endpoints:
  custom:
    - name: "DeepSeek"
      apiKey: "${DEEPSEEK_API_KEY}"
      baseURL: "https://api.deepseek.com/v1"
      models:
        default:
          - "deepseek-chat"
          - "deepseek-reasoner"
        fetch: false
      titleConvo: true
      titleModel: "deepseek-chat"
      modelDisplayLabel: "DeepSeek"
